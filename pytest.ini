[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --cov=lib
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml:htmlcov/cobertura.xml
    --cov-report=html:htmlcov
    --cov-fail-under=80