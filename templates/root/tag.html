<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Posts mit Tag: {{ tag }}</title>

    {% if active_theme %}
        <link rel="stylesheet" href="/static/{{ active_theme }}">
    {% endif %}
</head>
<body>
    <h1>Posts mit Tag: {{ tag }}</h1>

    {% if posts %}
        <ul>
            {% for post in posts %}
                <li>
                    <strong>{{ post.title }}</strong> by {{ post.author }}<br>
                    <small>{{ post.created_at }}</small><br>
                    <a href="/post/{{ post.slug }}">Read more</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Keine Posts mit diesem Tag.</p>
    {% endif %}

    <p><a href="/">Zurück zur Startseite</a></p>
</body>
</html>
