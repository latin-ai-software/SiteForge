<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Post erstellen</title>
</head>
<body>
    <h1>Neuen Post erstellen</h1>

    <form action="/create/post" method="POST" onsubmit="syncContent()">

        <label>Post-Titel:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Editor:</label><br>

        <!-- Toolbar -->
        <div>
            <button type="button" onclick="execCmd('bold')"><b>B</b></button>
            <button type="button" onclick="execCmd('italic')"><i>I</i></button>
            <button type="button" onclick="execCmd('underline')"><u>U</u></button>
            <button type="button" onclick="execCmd('insertUnorderedList')">• Liste</button>
            <button type="button" onclick="execCmd('insertOrderedList')">1. Liste</button>
            <button type="button" onclick="execCmd('createLink', prompt('URL:'))">Link</button>
            <button type="button" onclick="execCmd('removeFormat')">Format entfernen</button>
        </div>

        <!-- WYSIWYG Editor -->
        <div id="editor"
             contenteditable="true"
             style="width: 600px; height: 300px; border: 1px solid #ccc; padding: 10px; margin-top: 10px;">
        </div>

        <!-- Hidden textarea for sending HTML -->
        <textarea id="content" name="content" style="display:none;"></textarea>

        <br><br>
        <button type="submit">Speichern</button>
    </form>

    <script>
        function execCmd(cmd, value = null) {
            document.execCommand(cmd, false, value);
        }

        function syncContent() {
            document.getElementById("content").value = document.getElementById("editor").innerHTML;
        }
    </script>
</body>
</html>
