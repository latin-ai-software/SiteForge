<link rel="stylesheet" href="/static/theme.css">

<div class="admin-container">

    <div class="admin-header">
        <h1><i class="fa fa-paint-brush"></i> Theme Creator</h1>
        <p class="subtitle">Erstelle und bearbeite Themes direkt im Admin‑Panel.</p>
    </div>

    <div class="backup-actions">
        <a href="{{ url_for('theme_creator.new') }}" class="btn btn-primary">
            <i class="fa fa-plus"></i> Neues Theme erstellen
        </a>
    </div>

    {% if themes %}
    <table class="table table-striped table-dark backup-table">
        <thead>
            <tr>
                <th><i class="fa fa-file-code"></i> Theme</th>
                <th><i class="fa fa-cog"></i> Aktionen</th>
            </tr>
        </thead>
        <tbody>
        {% for theme in themes %}
            <tr>
                <td>{{ theme }}</td>
                <td>
                    <a href="{{ url_for('theme_creator.edit', name=theme) }}" class="btn btn-secondary btn-sm">
                        <i class="fa fa-edit"></i> Bearbeiten
                    </a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

    {% else %}
        <div class="empty-state">
            <i class="fa fa-folder-open"></i>
            <p>Keine Themes vorhanden. Erstelle ein neues Theme.</p>
        </div>
    {% endif %}

</div>

<style>
.admin-container {
    padding: 20px;
}

.admin-header h1 {
    margin-bottom: 5px;
}

.subtitle {
    opacity: 0.7;
    margin-bottom: 20px;
}

.backup-actions {
    margin-bottom: 20px;
}

.backup-table td, .backup-table th {
    vertical-align: middle;
}
</style>
