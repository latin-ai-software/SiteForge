<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Einstellungen</title>

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #020617;
            border-right: 1px solid #1f2937;
            padding: 24px 20px;
        }

        .sidebar h1 {
            font-size: 1.3rem;
            margin: 0 0 1.5rem;
            color: #f9fafb;
        }

        .sidebar nav a {
            display: block;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 6px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .sidebar nav a.active,
        .sidebar nav a:hover {
            background: #111827;
            color: #e5e7eb;
        }

        .main {
            flex: 1;
            padding: 24px 32px 40px;
        }

        .page-title {
            font-size: 1.6rem;
            margin: 0 0 1.5rem;
            color: #f9fafb;
        }

        .card {
            background: #020617;
            border-radius: 10px;
            border: 1px solid #1f2937;
            padding: 18px 20px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.45);
            margin-bottom: 24px;
        }

        .card h2 {
            margin: 0 0 0.75rem;
            font-size: 1.05rem;
            color: #e5e7eb;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #e5e7eb;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #374151;
            border-radius: 4px;
            background: #111827;
            color: #e5e7eb;
        }

        .form-group textarea {
            width: 100%;
            height: 100px;
            padding: 8px;
            border: 1px solid #374151;
            border-radius: 4px;
            background: #111827;
            color: #e5e7eb;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }

        .btn {
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            background: #2563eb;
            color: #f9fafb;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
<div class="layout">

    <aside class="sidebar">
        <h1>LatinMagazine Admin</h1>
        <nav>
            <a href="/admin/manage/templates">Stylesheets</a>
            <a href="/admin/posts">Beiträge</a>
            <a href="/admin/users">Benutzer</a>
            <a href="/admin/settings" class="active">Einstellungen</a>
        </nav>
    </aside>

    <main class="main">
        <h1 class="page-title">Einstellungen</h1>

        <form id="settingsForm">
            <section class="card">
                <h2>Allgemeine Einstellungen</h2>

                <div class="form-group">
                    <label for="site_title">Seitentitel:</label>
                    <input type="text" id="site_title" name="site_title" value="{{ settings.site_title }}">
                </div>

                <div class="form-group">
                    <label for="site_description">Seitenbeschreibung:</label>
                    <textarea id="site_description" name="site_description">{{ settings.site_description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="posts_per_page">Posts pro Seite:</label>
                    <input type="number" id="posts_per_page" name="posts_per_page" value="{{ settings.posts_per_page or 10 }}">
                </div>
            </section>

            <section class="card">
                <h2>Benutzer und Kommentare</h2>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="allow_registration" name="allow_registration" {% if settings.allow_registration %}checked{% endif %}>
                        <label for="allow_registration">Benutzerregistrierung erlauben</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="require_comment_approval" name="require_comment_approval" {% if settings.require_comment_approval %}checked{% endif %}>
                        <label for="require_comment_approval">Kommentare müssen freigegeben werden</label>
                    </div>
                </div>
            </section>

            <button type="submit" class="btn">Einstellungen speichern</button>
        </form>

    </main>

</div>

<script>
document.getElementById('settingsForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const response = await fetch('/admin/settings', {
        method: 'POST',
        body: formData
    });

    const result = await response.json();

    if (result.status === 'ok') {
        alert('Einstellungen gespeichert!');
    } else {
        alert('Fehler beim Speichern!');
    }
});
</script>
</body>
</html>
