stages:
  - test
  - security
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  DOCKER_TAG: $CI_COMMIT_SHA
  GIT_SUBMODULE_STRATEGY: recursive


# Test stage
test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
#    - git submodule sync --recursive
#    - git submodule update --init --recursive
  script:
    - python -m pytest --cov=lib --cov-report=html --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: htmlcov/cobertura.xml
    paths:
      - htmlcov/
    expire_in: 7 days
  only:
    - merge_requests
    - main

# Security scanning
bandit_scan:
  stage: security
  image: python:3.12
  script:
    - pip install bandit
    - bandit -r . -x Identitas,Intermediarium -f html -o bandit-report.html --exit-zero
  artifacts:
    paths:
      - bandit-report.html
    expire_in: 7 days

# Build Docker image
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - main

